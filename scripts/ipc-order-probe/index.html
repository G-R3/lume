<!doctype html>
<meta charset="utf-8" />
<script>
  const rounds = Number(new URLSearchParams(location.search).get("rounds"));
  const byKind = {};
  let applied = 0;
  let last = 0;
  let lastKind = "";
  let lastReply = 0;
  let repliesOutOfOrder = 0;
  let violations = 0;

  function apply(kind, value) {
    applied++;

    if (kind !== "push") {
      if (value < lastReply) repliesOutOfOrder++;
      else lastReply = value;
    }

    if (value < last) {
      violations++;
      byKind[`${kind}<-${lastKind}`] = (byKind[`${kind}<-${lastKind}`] || 0) + 1;
    } else {
      last = value;
      lastKind = kind;
    }
  }

  async function deep(call, kind) {
    let value = await call();

    for (let hop = 0; hop < 40; hop++) value = await Promise.resolve(value);

    apply(kind, value);
  }

  async function shallow(call, kind) {
    apply(kind, await call());
  }

  window.lume.onPush((value) => apply("push", value));

  (async () => {
    window.lume.ready();
    await new Promise((resolve) => setTimeout(resolve, 50));
    last = 0;

    const pending = [];

    for (let round = 0; round < rounds; round++) {
      pending.push(deep(window.lume.read, "read"));
      if (round % 3 === 0) pending.push(shallow(window.lume.slow, "slow"));
      if (round % 200 === 0) await Promise.all(pending.splice(0));
    }

    await Promise.all(pending);
    window.lume.done({ applied, byKind, repliesOutOfOrder, rounds, violations });
  })();
</script>
